policies:
  - id: "POL-01"
    name: "Root Execution Ban"
    check_type: "user_id"
    expected_value: "non-root"
  - id: "POL-02"
    name: "SSH Port Closure"
    check_type: "exposed_ports"
    forbidden_port: "22/tcp"
  - id: "POL-03"
    name: "Strict File Permissions"
    check_type: "file_permission"
    target_file: "/etc/shadow"
    expected_mask: "400"
  - id: "POL-04"
    name: "Required Auditing Tool"
    check_type: "running_process"
    required_process: "auditd"

  - id: "POL-05"
    name: "No Plaintext Traffic"
    check_type: "exposed_ports"
    forbidden_port: "80/tcp"
